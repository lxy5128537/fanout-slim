name: Build & Release

on:
  push:
    tags:
      - "Ver*"
    branches:
      - main
  workflow_dispatch:

env:
  BINARY_NAME: fout
  LDFLAGS: -s -w

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          [ -z "$VERSION" ] && VERSION="main-$(date +%Y%m%d)"
          SUFFIX="${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ -n "${{ matrix.goarm }}" ]; then SUFFIX="${SUFFIX}-v${{ matrix.goarm }}"; fi
          mkdir -p dist
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" GOARM="${{ matrix.goarm }}" \
            CGO_ENABLED=0 \
            go build -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${BINARY_NAME}-${SUFFIX}-${VERSION}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('-v{0}', matrix.goarm) }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/Ver')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f
          gh release create "${GITHUB_REF_NAME}" \
            dist/**/* \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"